plugins {
    id "base"
    id "com.gradleup.shadow" version "9.3.1" apply false
    id "org.sonarqube" version "7.1.0.6387"
}

allprojects {
    group = "io.github.em"
    version = "1.0-SNAPSHOT"

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "jacoco"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(11)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 11
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:5.10.3")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testImplementation "org.mockito:mockito-core:5.21.0"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    jacoco {
        toolVersion = "0.8.11"
    }

    tasks.named("test") {
        useJUnitPlatform()
        finalizedBy tasks.named("jacocoTestReport")
    }

    tasks.named("jacocoTestReport") {
        dependsOn tasks.named("test")
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    tasks.named("jacocoTestCoverageVerification") {
        dependsOn tasks.named("test")
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.80
                }
            }
        }
    }

    tasks.named("check") {
        dependsOn tasks.named("jacocoTestCoverageVerification")
    }
}

sonar {
    properties {
        property "sonar.projectKey", "erik-marten_VeriLog"
        property "sonar.organization", "erik-marten"
    }
}

// Keep qualified root lifecycle tasks useful as well as Gradle's task selectors.
["assemble", "check", "build", "clean"].each { taskName ->
    tasks.named(taskName) {
        dependsOn subprojects.collect { "${it.path}:${taskName}" }
    }
}
