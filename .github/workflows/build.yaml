name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: gradle/actions/wrapper-validation@v6.3.0

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            11
            21

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build + tests + coverage
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 clean build

      - name: Upload build artifacts (JARs)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verilogjava-build
          path: VeriLogJava/verilog-*/build/libs/*.jar
          if-no-files-found: error

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: |
            VeriLogJava/verilog-core/build/reports/jacoco/test/html/**
            VeriLogJava/verilog-core/build/reports/jacoco/test/jacocoTestReport.xml
            VeriLogJava/verilog-cli/build/reports/jacoco/test/html/**
            VeriLogJava/verilog-cli/build/reports/jacoco/test/jacocoTestReport.xml

  sonar:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            11
            21

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build + coverage for Sonar
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 clean test jacocoTestReport

      - name: SonarQube analysis
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
